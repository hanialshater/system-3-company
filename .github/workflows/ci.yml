name: ci

on:
  push:
  pull_request:

jobs:
  constitution:
    # Protected paths change only with a ratified amendment referenced in a commit message.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check protected paths
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base to compare (new branch); skipping."; exit 0
          fi
          PATTERNS=$(grep -v '^#' company/constitution/protected-paths.txt | sed '/^$/d')
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          HIT=""
          for f in $CHANGED; do
            for g in $PATTERNS; do
              case "$f" in $g) HIT="$HIT $f";; esac
            done
          done
          if [ -n "$HIT" ]; then
            if git log --format=%B "$BASE..HEAD" | grep -qE '^Amendment: AMD-[0-9]+'; then
              AMD=$(git log --format=%B "$BASE..HEAD" | grep -oE 'AMD-[0-9]+' | head -1)
              ls company/constitution/amendments/$AMD-*.md >/dev/null 2>&1 || { echo "Referenced $AMD has no file"; exit 1; }
              grep -q '^status: ratified' company/constitution/amendments/$AMD-*.md || { echo "$AMD is not ratified"; exit 1; }
              echo "Protected changes covered by $AMD:$HIT"
            else
              echo "Protected paths changed without an amendment:$HIT"; exit 1
            fi
          fi

  verify:
    # AMD-002: a newer push to the same ref cancels this job. Only this job: the constitution
    # job checks the diff since the previous push, so cancelling it would skip that diff unseen.
    concurrency:
      group: ci-verify-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # AMD-013 part (b): the harness Node suites that `npm run verify` runs, in verify's order. They run
      # before the build so a broken gate, dispatch, memory, mailbox or publish tool fails fast (about 60 s
      # in total on 2026-10-17; the three S3_SLOW_TESTS dispatch cases stay skipped, as in verify).
      - run: npm run test:deploy
      - run: npm run test:publish
      - run: npm run test:lifehacks
      - run: npm run test:books
      - run: npm run test:algorithms
      - run: npm run test:kit
      - run: npm run test:hq
      - run: npm run test:platform
      - run: npm run test:dispatch
      - run: npm run test:mailbox
      - run: npm run test:memory
      - run: npm run test:metrics
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run qa
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa
          path: |
            test-results/
            artifacts/qa/
          retention-days: 7
