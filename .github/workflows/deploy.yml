name: Deploy to Vercel

on:
  # Manual only (founder decision 2026-10-16): no automatic deploy after CI. Every deploy,
  # preview included, needs the founder's approval of that deploy (CLAUDE.md).
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        type: choice
        options: [preview, production]
        default: preview
        required: true

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    # Only the default branch can receive deployment credentials; manual runs must select it.
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && 'production' || 'preview-deploy' }}
    env:
      CI: "1"
      DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'preview' }}
      RELEASE_SHA: ${{ github.sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Check Vercel configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          for (const key of ['VERCEL_ORG_ID', 'VERCEL_PROJECT_ID', 'VERCEL_TOKEN']) {
            if (!process.env[key]) throw new Error(`Configure ${key} in this deployment environment. See company/ops/runbook-deploy.md.`);
          }
          JS
      - name: Install dependencies
        run: npm ci
      - name: Install the QA browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify, build, deploy and smoke-test
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npm run deploy -- "$DEPLOY_TARGET" --prebuilt
      - name: Summarize the release
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const dir = 'company/ops/deployments';
          const records = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => f.endsWith('.json')).sort().reverse() : [];
          const record = records.map(f => JSON.parse(fs.readFileSync(`${dir}/${f}`, 'utf8')))
            .find(r => r.commit === process.env.RELEASE_SHA && r.target === process.env.DEPLOY_TARGET);
          const summary = record
            ? `Deployment: **${record.status}**\n\nEnvironment: ${record.target}\n\nCommit: ${record.commit}\n\n${record.url ? `URL: ${record.url}\n\n` : ''}${record.failedStep ? `Failed step: ${record.failedStep}\n` : ''}`
            : 'No deployment record was created. Check the configuration/install steps.\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          JS
      - name: Save release records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-${{ env.DEPLOY_TARGET }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: company/ops/deployments/*.json
          if-no-files-found: ignore
          retention-days: 30
