<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Life Hacks: five prepared-brief stage wireframes</title>
  <desc id="desc">Interaction layout reference, not empirical evidence. Five phone-stage artboards show edge-on towel exposure, a study timeline, square-table contact, paired shoe orientations, and stored string trials. Shoe loops are placeholders; crossing topology must follow the verified source.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#246c8c"/></marker>
    <style>
      text{font:13px system-ui,sans-serif;fill:#24333d}.title{font-weight:700;font-size:15px}.muted{fill:#657b88}.line{stroke:#adbbc2;fill:none}.active{stroke:#246c8c;stroke-width:3;fill:none}.ghost{stroke:#a3b7c1;stroke-dasharray:4 3;fill:none}.button{fill:#e8eff3;stroke:#adbbc2}.small{font-size:11px}.board{fill:#fff;stroke:#a3b4be}.note{font-size:12px;fill:#657b88}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f4f7f8"/>
  <text x="24" y="28" class="title">Prepared Life Hacks stages · layout wireframes</text>
  <text x="24" y="49" class="note">Use existing design tokens in implementation. Stages are schematic; labels and model values are layout examples.</text>

  <g transform="translate(24 70)">
    <rect width="360" height="290" rx="14" class="board"/>
    <text x="18" y="26" class="title">1 · Towel: exposed faces</text>
    <text x="18" y="47" class="small muted">Illustrative; fixed humidity, temperature</text>
    <rect x="88" y="104" width="184" height="14" rx="3" fill="#d8e7ed" stroke="#246c8c" stroke-width="3"/>
    <rect x="130" y="98" width="100" height="52" rx="3" class="ghost"/>
    <path d="M136 111H224M136 124H224M136 137H224" class="ghost"/>
    <g stroke="#246c8c" stroke-width="2" marker-end="url(#arrow)"><path d="M104 100V73"/><path d="M145 100V73"/><path d="M186 100V73"/><path d="M227 100V73"/><path d="M265 100V73"/><path d="M104 123V167"/><path d="M145 123V167"/><path d="M186 123V167"/><path d="M227 123V167"/><path d="M265 123V167"/></g>
    <text x="26" y="192">Area 1.96 m²</text><text x="198" y="192">Still: 3.0/11.3 h</text>
    <rect x="18" y="211" width="102" height="44" rx="7" class="button"/><text x="53" y="238">Half</text>
    <rect x="129" y="211" width="102" height="44" rx="7" class="button"/><text x="151" y="238">Quarters</text>
    <rect x="240" y="211" width="102" height="44" rx="7" fill="#d8e7ed" stroke="#246c8c"/><text x="268" y="238">Spread</text>
    <text x="18" y="277" class="note">Breeze control below · retained quarters outline</text>
  </g>

  <g transform="translate(420 70)">
    <rect width="360" height="290" rx="14" class="board"/>
    <text x="18" y="26" class="title">2 · Spacing: timeline evidence</text>
    <text x="18" y="47" class="small muted">Illustrative model · three hours each</text>
    <path d="M42 64V180H330" class="line"/>
    <path d="M72 74C95 99 130 130 175 151S275 170 327 172" class="active"/>
    <path d="M72 86C128 96 235 109 327 123" stroke="#a14b26" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
    <path d="M83 66V181M327 66V181" class="ghost"/>
    <circle cx="83" cy="81" r="4" fill="#246c8c"/><circle cx="83" cy="89" r="4" fill="#a14b26"/>
    <circle cx="327" cy="172" r="4" fill="#246c8c"/><circle cx="327" cy="123" r="4" fill="#a14b26"/>
    <text x="18" y="91" class="small">A</text><text x="18" y="125" class="small">B</text>
    <text x="50" y="197" class="small">−2 −1 0</text><text x="314" y="197" class="small">30</text>
    <text x="44" y="216" class="small muted">↻ ↻ ↻ Recall, then study</text>
    <rect x="18" y="230" width="153" height="44" rx="7" class="button"/><text x="44" y="257">Next morning</text>
    <rect x="189" y="230" width="153" height="44" rx="7" class="button"/><text x="234" y="257">One month</text>
  </g>

  <g transform="translate(816 70)">
    <rect width="360" height="290" rx="14" class="board"/>
    <text x="18" y="26" class="title">3 · Table: signed gap</text>
    <path d="M36 80Q170 49 328 86M32 105Q161 72 330 109M30 134Q163 99 334 137M28 163Q174 127 337 165" class="ghost"/>
    <rect x="116" y="66" width="123" height="123" transform="rotate(30 177.5 127.5)" fill="#e5ebee" stroke="#246c8c" stroke-width="3"/>
    <g fill="#246c8c"><circle cx="155" cy="44" r="5"/><circle cx="261" cy="106" r="5"/><circle cx="200" cy="211" r="5"/><circle cx="93" cy="151" r="5"/></g>
    <path d="M40 219H110M77 192V219" stroke="#24333d" stroke-width="2"/>
    <circle cx="77" cy="219" r="5" fill="#246c8c"/>
    <text x="120" y="223">Gap +0.0 mm</text>
    <text x="18" y="245" class="small">Feet down ≠ level. Clear hot drinks before turning.</text>
    <text x="18" y="270" class="note">Angle · Floor · Short · Equal · Contact</text>
  </g>

  <g transform="translate(220 388)">
    <rect width="360" height="290" rx="14" class="board"/>
    <text x="18" y="26" class="title">4 · Bows: shared walking test</text>
    <text x="18" y="47" class="small muted">Loops are topology placeholders; source crossings required.</text>
    <path d="M85 73C116 73 132 96 132 166V203Q106 219 80 203V137C76 110 71 76 85 73Z" fill="#edf1f3" stroke="#a3b4be"/>
    <path d="M255 73C286 73 302 96 302 166V203Q276 219 250 203V137C246 110 241 76 255 73Z" fill="#edf1f3" stroke="#a3b4be"/>
    <ellipse cx="105" cy="124" rx="13" ry="25" class="ghost"/>
    <ellipse cx="275" cy="125" rx="32" ry="11" class="active"/>
    <path d="M101 144Q79 161 95 182M109 145Q130 163 123 183" class="ghost"/>
    <path d="M271 135Q246 153 250 173M280 135Q302 150 293 170" class="active"/>
    <text x="84" y="229">A: along</text><text x="242" y="229">B: across</text>
    <rect x="18" y="241" width="98" height="44" rx="7" class="button"/><text x="28" y="268">A: reverse</text>
    <rect x="131" y="241" width="98" height="44" rx="7" class="button"/><text x="141" y="268">B: reverse</text>
    <rect x="244" y="241" width="98" height="44" rx="7" class="button"/><text x="263" y="268">Walk 10</text>
  </g>

  <g transform="translate(620 388)">
    <rect width="360" height="290" rx="14" class="board"/>
    <text x="18" y="26" class="title">5 · Cord: preserved trial tallies</text>
    <text x="18" y="47" class="small muted">Sampled model · seed 17 · 30cm, 1turn/s, 10s</text>
    <rect x="93" y="61" width="176" height="108" rx="5" fill="#edf1f3" stroke="#a3b4be"/>
    <path d="M120 136C102 82 218 69 238 111S169 161 145 123S215 86 227 136" stroke="#246c8c" stroke-width="3" fill="none"/>
    <circle cx="120" cy="136" r="4" fill="#a14b26"/><circle cx="227" cy="136" r="4" fill="#a14b26"/>
    <text x="18" y="195" class="small">Short 0/20</text><text x="194" y="195" class="small">Long 10/20</text>
    <g fill="none" stroke="#a3b4be"><circle cx="22" cy="211" r="5"/><circle cx="36" cy="211" r="5"/><circle cx="50" cy="211" r="5"/><circle cx="64" cy="211" r="5"/><circle cx="78" cy="211" r="5"/><circle cx="92" cy="211" r="5"/><circle cx="106" cy="211" r="5"/><circle cx="120" cy="211" r="5"/><circle cx="134" cy="211" r="5"/><circle cx="148" cy="211" r="5"/></g>
    <g fill="none" stroke="#a3b4be"><circle cx="22" cy="225" r="5"/><circle cx="36" cy="225" r="5"/><circle cx="50" cy="225" r="5"/><circle cx="64" cy="225" r="5"/><circle cx="78" cy="225" r="5"/><circle cx="92" cy="225" r="5"/><circle cx="106" cy="225" r="5"/><circle cx="120" cy="225" r="5"/><circle cx="134" cy="225" r="5"/><circle cx="148" cy="225" r="5"/></g>
    <g stroke="#246c8c" fill="none"><path d="M191 205l10 11m0-11-10 11M219 205l10 11m0-11-10 11M247 205l10 11m0-11-10 11M275 205l10 11m0-11-10 11M303 205l10 11m0-11-10 11"/><circle cx="212" cy="211" r="5"/><circle cx="240" cy="211" r="5"/><circle cx="268" cy="211" r="5"/><circle cx="296" cy="211" r="5"/><circle cx="324" cy="211" r="5"/></g>
    <g stroke="#246c8c" fill="none"><path d="M191 219l10 11m0-11-10 11M219 219l10 11m0-11-10 11M247 219l10 11m0-11-10 11M275 219l10 11m0-11-10 11M303 219l10 11m0-11-10 11"/><circle cx="212" cy="225" r="5"/><circle cx="240" cy="225" r="5"/><circle cx="268" cy="225" r="5"/><circle cx="296" cy="225" r="5"/><circle cx="324" cy="225" r="5"/></g>
    <rect x="18" y="236" width="153" height="44" rx="7" class="button"/><text x="65" y="263">20 short</text>
    <rect x="189" y="236" width="153" height="44" rx="7" class="button"/><text x="237" y="263">20 long</text>
  </g>
</svg>
