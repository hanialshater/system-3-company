<!-- Rough wireframe for company/design/specs/two-stacks-make-a-queue.md. 390x844 per frame. Not a visual design. -->
<g transform="translate(0,0)"><text x="0" y="16" font-size="13"  fill="#141824" font-weight="700">1. Predict (locked)</text><rect x="0" y="24" width="390" height="844" rx="20" fill="#f6f7fb" stroke="#141824"  /><text x="16" y="56" font-size="11"  fill="#5d6578" >S3  top bar</text><text x="16" y="92" font-size="16"  fill="#141824" font-weight="700">A queue from two stacks</text><text x="16" y="112" font-size="11"  fill="#5d6578" >Pouring sounds slow. How slow is it, really?</text><rect x="12" y="124" width="366" height="400" rx="8" fill="#eceff6" stroke="#d9dde8"  /><text x="25" y="144" font-size="10"  fill="#5d6578" >Remove pops the out-stack. Only when empty, pour the whole in-stack over.</text><text x="362" y="140" font-size="9" text-anchor="end" fill="#9aa3b5" >stage</text><text x="30" y="170" font-size="9"  fill="#5d6578" >Waiting</text><text x="150" y="170" font-size="10" text-anchor="middle" fill="#141824" font-weight="700">in</text><text x="230" y="170" font-size="10" text-anchor="middle" fill="#141824" font-weight="700">out</text><text x="320" y="170" font-size="9" text-anchor="middle" fill="#5d6578" >Left</text><rect x="125" y="178" width="50" height="190" rx="4" fill="none" stroke="#9aa3b5"  /><rect x="205" y="178" width="50" height="190" rx="4" fill="none" stroke="#9aa3b5"  /><rect x="25" y="178" width="40" height="40" rx="4" fill="#9ad7cc" stroke="#2a7a70"  /><text x="45" y="198" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">1</text><text x="45" y="212" font-size="7" text-anchor="middle" fill="#141824" >moved ?</text><rect x="25" y="224" width="40" height="40" rx="4" fill="#9ad7cc" stroke="#2a7a70"  /><text x="45" y="244" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">2</text><text x="45" y="258" font-size="7" text-anchor="middle" fill="#141824" >moved ?</text><rect x="25" y="270" width="40" height="40" rx="4" fill="#9ad7cc" stroke="#2a7a70"  /><text x="45" y="290" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">3</text><text x="45" y="304" font-size="7" text-anchor="middle" fill="#141824" >moved ?</text><rect x="25" y="316" width="40" height="40" rx="4" fill="#9ad7cc" stroke="#2a7a70"  /><text x="45" y="336" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">4</text><text x="45" y="350" font-size="7" text-anchor="middle" fill="#141824" >moved ?</text><text x="25" y="400" font-size="11"  fill="#141824" font-weight="700">Pours: ? · Left: —</text><rect x="25" y="420" width="82" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="66" y="447" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">Add 1</text><rect x="111" y="420" width="82" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="152" y="447" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">Add 2</text><rect x="197" y="420" width="82" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="238" y="447" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">Add 3</text><rect x="283" y="420" width="82" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="324" y="447" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">Add 4</text><rect x="25" y="470" width="82" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="66" y="497" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">Remove 1st</text><rect x="111" y="470" width="82" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="152" y="497" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">Remove 2nd</text><rect x="197" y="470" width="82" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="238" y="497" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">Remove 3rd</text><rect x="283" y="470" width="82" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="324" y="497" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700