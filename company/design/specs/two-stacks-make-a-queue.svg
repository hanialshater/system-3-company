<g transform="translate(410,0)"><text x="0" y="16" font-size="13"  fill="#141824" font-weight="700">2. Explore: Remove 1st (the pour)</text><rect x="0" y="24" width="390" height="844" rx="20" fill="#f6f7fb" stroke="#141824"  /><text x="16" y="56" font-size="11"  fill="#5d6578" >S3  top bar</text><text x="16" y="92" font-size="16"  fill="#141824" font-weight="700">A queue from two stacks</text><text x="16" y="112" font-size="11"  fill="#5d6578" >Pouring sounds slow. How slow is it, really?</text><rect x="12" y="124" width="366" height="420" rx="8" fill="#eceff6" stroke="#d9dde8"  /><text x="25" y="144" font-size="10"  fill="#5d6578" >Remove pops the out-stack. Only when empty, pour the whole in-stack over.</text><text x="362" y="140" font-size="9" text-anchor="end" fill="#9aa3b5" >stage</text><text x="30" y="170" font-size="9"  fill="#5d6578" >Waiting</text><text x="150" y="170" font-size="10" text-anchor="middle" fill="#141824" font-weight="700">in</text><text x="230" y="170" font-size="10" text-anchor="middle" fill="#141824" font-weight="700">out</text><text x="320" y="170" font-size="9" text-anchor="middle" fill="#5d6578" >Left</text><rect x="125" y="178" width="50" height="190" rx="4" fill="none" stroke="#9aa3b5"  /><rect x="205" y="178" width="50" height="190" rx="4" fill="none" stroke="#9aa3b5"  /><path d="M160,176 Q190,150 220,176" fill="none" stroke="#f6c453" stroke-width="3"/><rect x="210" y="322" width="40" height="40" rx="4" fill="#9ad7cc" stroke="#2a7a70"  /><text x="230" y="342" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">4</text><text x="230" y="356" font-size="7" text-anchor="middle" fill="#141824" >moved 1</text><rect x="210" y="276" width="40" height="40" rx="4" fill="#9ad7cc" stroke="#2a7a70"  /><text x="230" y="296" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">3</text><text x="230" y="310" font-size="7" text-anchor="middle" fill="#141824" >moved 1</text><rect x="210" y="230" width="40" height="40" rx="4" fill="#9ad7cc" stroke="#2a7a70"  /><text x="230" y="250" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">2</text><text x="230" y="264" font-size="7" text-anchor="middle" fill="#141824" >moved 1</text><rect x="300" y="178" width="40" height="40" rx="4" fill="#9ad7cc" stroke="#2a7a70"  /><text x="320" y="198" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">1</text><text x="320" y="212" font-size="7" text-anchor="middle" fill="#141824" >moved 1</text><text x="25" y="400" font-size="11"  fill="#141824" font-weight="700">Pours: 1 · Left: 1</text><rect x="25" y="420" width="82" height="44" rx="8" fill="#fff" stroke="#9aa3b5"  /><text x="66" y="447" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">Add 1</text><rect x="111" y="420" width="82" height="44" rx="8" fill="#fff" stroke="#9aa3b5"  /><text x="152" y="447" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">Add 2</text><rect x="197" y="420" width="82" height="44" rx="8" fill="#fff" stroke="#9aa3b5"  /><text x="238" y="447" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">Add 3</text><rect x="283" y="420" width="82" height="44" rx="8" fill="#fff" stroke="#9aa3b5"  /><text x="324" y="447" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">Add 4</text><rect x="25" y="470" width="82" height="44" rx="8" fill="#cfe8e4" stroke="#2a7a70"  /><text x="66" y="497" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">Remove 1st</text><rect x="111" y="470" width="82" height="44" rx="8" fill="#fff" stroke="#9aa3b5"  /><text x="152" y="497" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">Remove 2nd</text><rect x="197" y="470" width="82" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="238" y="497" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">Remove 3rd</text><rect x="283" y="470" width="82" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="324" y="497" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">Remove 4th</text><text x="25" y="540" font-size="9"  fill="#c0392b" >pour &lt;= 400 ms; each badge 0 -&gt; 1</text><line x1="12" y1="552" x2="378" y2="552" stroke="#d9dde8" stroke-width="1" /><text x="24" y="570" font-size="11"  fill="#141824" >Next: Remove 2nd -&gt; "out not empty: no pour".</text><text x="24" y="588" font-size="11"  fill="#141824" >QA path: Add 1-4, Remove x4, one press each.</text><text x="24" y="606" font-size="11"  fill="#c0392b" >!Only the next tile is live; played tiles scrub back.</text><rect x="24" y="624" width="342" height="44" rx="8" fill="#fff" stroke="#9aa3b5"  /><text x="195" y="651" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">Show me why</text></g>
<g transform="translate(820,0)"><text x="0" y="16" font-size="13"  fill="#141824" font-weight="700">3. Reveal: all four left</text><rect x="0" y="24" width="390" height="844" rx="20" fill="#f6f7fb" stroke="#141824"  /><text x="16" y="56" font-size="11"  fill="#5d6578" >S3  top bar</text><text x="16" y="92" font-size="16"  fill="#141824" font-weight="700">A queue from two stacks</text><text x="16" y="112" font-size="11"  fill="#5d6578" >Pouring sounds slow. How slow is it, really?</text><rect x="12" y="124" width="366" height="400" rx="8" fill="#eceff6" stroke="#d9dde8"  /><text x="25" y="144" font-size="10"  fill="#5d6578" >Remove pops the out-stack. Only when empty, pour the whole in-stack over.</text><text x="362" y="140" font-size="9" text-anchor="end" fill="#9aa3b5" >stage</text><text x="30" y="170" font-size="9"  fill="#5d6578" >Waiting</text><text x="150" y="170" font-size="10" text-anchor="middle" fill="#141824" font-weight="700">in</text><text x="230" y="170" font-size="10" text-anchor="middle" fill="#141824" font-weight="700">out</text><text x="320" y="170" font-size="9" text-anchor="middle" fill="#5d6578" >Left</text><rect x="125" y="178" width="50" height="190" rx="4" fill="none" stroke="#9aa3b5"  /><rect x="205" y="178" width="50" height="190" rx="4" fill="none" stroke="#9aa3b5"  /><rect x="300" y="178" width="40" height="40" rx="4" fill="#9ad7cc" stroke="#2a7a70"  /><text x="320" y="198" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">1</text><text x="320" y="212" font-size="7" text-anchor="middle" fill="#141824" >moved 1</text><rect x="300" y="224" width="40" height="40" rx="4" fill="#9ad7cc" stroke="#2a7a70"  /><text x="320" y="244" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">2</text><text x="320" y="258" font-size="7" text-anchor="middle" fill="#141824" >moved 1</text><rect x="300" y="270" width="40" height="40" rx="4" fill="#9ad7cc" stroke="#2a7a70"  /><text x="320" y="290" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">3</text><text x="320" y="304" font-size="7" text-anchor="middle" fill="#141824" >moved 1</text><rect x="300" y="316" width="40" height="40" rx="4" fill="#9ad7cc" stroke="#2a7a70"  /><text x="320" y="336" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">4</text><text x="320" y="350" font-size="7" text-anchor="middle" fill="#141824" >moved 1</text><text x="25" y="400" font-size="11"  fill="#141824" font-weight="700">Pours: 1 · Left: 1 2 3 4 (pinned)</text><rect x="25" y="420" width="82" height="44" rx="8" fill="#fff" stroke="#9aa3b5"  /><text x="66" y="447" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">Add 1</text><rect x="111" y="420" width="82" height="44" rx="8" fill="#fff" stroke="#9aa3b5"  /><text x="152" y="447" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">Add 2</text><rect x="197" y="420" width="82" height="44" rx="8" fill="#fff" stroke="#9aa3b5"  /><text x="238" y="447" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">Add 3</text><rect x="283" y="420" width="82" height="44" rx="8" fill="#fff" stroke="#9aa3b5"  /><text x="324" y="447" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">Add 4</text><rect x="25" y="470" width="82" height="44" rx="8" fill="#fff" stroke="#9aa3b5"  /><text x="66" y="497" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">Remove 1st</text><rect x="111" y="470" width="82" height="44" rx="8" fill="#fff" stroke="#9aa3b5"  /><text x="152" y="497" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">Remove 2nd</text><rect x="197" y="470" width="82" height="44" rx="8" fill="#fff" stroke="#9aa3b5"  /><text x="238" y="497" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">Remove 3rd</text><rect x="283" y="470" width="82" height="44" rx="8" fill="#cfe8e4" stroke="#2a7a70"  /><text x="324" y="497" font-size="11" text-anchor="middle" fill="#141824" font-weight="700">Remove 4th</text><line x1="12" y1="532" x2="378" y2="532" stroke="#d9dde8" stroke-width="1" /><text x="24" y="550" font-size="11"  fill="#141824" >Your prediction held.</text><text x="24" y="568" font-size="11"  fill="#141824" >Your one pour moved 4 items, each once. The next</text><text x="24" y="586" font-size="11"  fill="#141824" >three removals moved nothing. Each item is poured at</text><text x="24" y="604" font-size="11"  fill="#141824" >most once in its life, so the average cost stays</text><text x="24" y="622" font-size="11"  fill="#141824" >constant. ...</text></g>
