<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 1250 880" font-family="system-ui, sans-serif">
<rect x="-10" y="0" width="1250" height="880" fill="#fff"/>
<!-- Rough wireframe for company/design/specs/knapsack-ratio-trap.md. 390x844 per frame. Not a visual design. Button order 10, 30, 20 is the QA one-press path. -->
<g transform="translate(0,0)"><text x="0" y="16" font-size="13" fill="#141824" font-weight="700">1. Predict (locked)</text><rect x="0" y="24" width="390" height="844" rx="20" fill="#f6f7fb" stroke="#141824"/><text x="16" y="56" font-size="11" fill="#5d6578">S3  top bar</text><text x="16" y="92" font-size="16" fill="#141824" font-weight="700">Best value per kilo first?</text><text x="16" y="112" font-size="11" fill="#5d6578">Whole items only. Can you beat $160?</text><rect x="12" y="124" width="366" height="560" rx="8" fill="#eceff6" stroke="#d9dde8"/><text x="24" y="144" font-size="10" fill="#5d6578">Bag holds 50 kg. Tap an item to pack it.</text><rect x="40" y="200" width="120" height="250" rx="4" fill="#fff" stroke="#141824" stroke-width="2"/><text x="100" y="194" font-size="9" fill="#5d6578" text-anchor="middle">50 kg</text><line x1="36" y1="400" x2="40" y2="400" stroke="#5d6578" stroke-width="1.5"/><line x1="36" y1="350" x2="40" y2="350" stroke="#5d6578" stroke-width="1.5"/><line x1="36" y1="300" x2="40" y2="300" stroke="#5d6578" stroke-width="1.5"/><line x1="36" y1="250" x2="40" y2="250" stroke="#5d6578" stroke-width="1.5"/><rect x="44" y="401" width="112" height="48" rx="3" fill="#7fb8e6" stroke="#141824"/><text x="100" y="429" font-size="9.5" fill="#141824" text-anchor="middle" font-weight="700">10 kg · $60</text><rect x="44" y="301" width="112" height="98" rx="3" fill="#7fb8e6" stroke="#141824"/><text x="100" y="354" font-size="9.5" fill="#141824" text-anchor="middle" font-weight="700">20 kg · $100</text><rect x="44" y="201" width="112" height="98" rx="3" fill="#fff" stroke="#5d6578" stroke-dasharray="4 3"/><text x="100" y="254" font-size="9.5" fill="#5d6578" text-anchor="middle">20 kg empty</text><text x="100" y="176" font-size="11" fill="#141824" text-anchor="middle" font-weight="700">Packed 30/50 kg · $160</text><text x="270" y="194" font-size="10" fill="#5d6578" text-anchor="middle">Shelf</text><rect x="220" y="210" width="100" height="148" rx="3" fill="#fff" stroke="#141824"/><text x="270" y="287" font-size="9.5" fill="#141824" text-anchor="middle">30 kg · $120</text><text x="270" y="299" font-size="8.5" fill="#5d6578" text-anchor="middle">$4/kg</text><text x="24" y="480" font-size="10" fill="#5d6578">Best whole-item bag so far: $160 (ratio first)</text><rect x="16" y="520" width="112" height="44" rx="6" fill="#7fb8e6" stroke="#9aa3b5"/><text x="72" y="546" font-size="11" fill="#9aa3b5" text-anchor="middle" font-weight="700">10 kg · $60</text><rect x="139" y="520" width="112" height="44" rx="6" fill="#eceff6" stroke="#9aa3b5"/><text x="195" y="546" font-size="11" fill="#9aa3b5" text-anchor="middle" font-weight="700">30 kg · $120</text><rect x="262" y="520" width="112" height="44" rx="6" fill="#7fb8e6" stroke="#9aa3b5"/><text x="318" y="546" font-size="11" fill="#9aa3b5" text-anchor="middle" font-weight="700">20 kg · $100</text><rect x="16" y="572" width="358" height="44" rx="6" fill="#eceff6" stroke="#9aa3b5"/><text x="195" y="598" font-size="11" fill="#9aa3b5" text-anchor="middle" font-weight="700">Items can be cut: off</text><rect x="12" y="690" width="366" height="150" rx="8" fill="#fff" stroke="#d9dde8"/><text x="24" y="712" font-size="11" fill="#141824" font-weight="700">Ratio first gives $160. Best possible?</text><rect x="24" y="724" width="342" height="30" rx="6" fill="#eceff6" stroke="#d9dde8"/><text x="36" y="744" font-size="11" fill="#141824">A) $160</text><rect x="24" y="760" width="342" height="30" rx="6" fill="#eceff6" stroke="#d9dde8"/><text x="36" y="780" font-size="11" fill="#141824">B) $220</text><rect x="24" y="796" width="342" height="30" rx="6" fill="#eceff6" stroke="#d9dde8"/><text x="36" y="816" font-size="11" fill="#141824">C) $240</text></g>
<g transform="translate(410,0)"><text x="0" y="16" font-size="13" fill="#141824" font-weight="700">2. Explore: 10 out, 30 in</text><rect x="0" y="24" width="390" height="844" rx="20" fill="#f6f7fb" stroke="#141824"/><text x="16" y="56" font-size="11" fill="#5d6578">S3  top bar</text><text x="16" y="92" font-size="16" fill="#141824" font-weight="700">Best value per kilo first?</text><text x="16" y="112" font-size="11" fill="#5d6578">Milestone 1: whole bag at $220</text><rect x="12" y="124" width="366" height="560" rx="8" fill="#eceff6" stroke="#d9dde8"/><text x="24" y="144" font-size="10" fill="#5d6578">Bag holds 50 kg. Tap an item to pack it.</text><rect x="40" y="200" width="120" height="250" rx="4" fill="#fff" stroke="#141824" stroke-width="2"/><text x="100" y="194" font-size="9" fill="#5d6578" text-anchor="middle">50 kg</text><line x1="36" y1="400" x2="40" y2="400" stroke="#5d6578" stroke-width="1.5"/><line x1="36" y1="350" x2="40" y2="350" stroke="#5d6578" stroke-width="1.5"/><line x1="36" y1="300" x2="40" y2="300" stroke="#5d6578" stroke-width="1.5"/><line x1="36" y1="250" x2="40" y2="250" stroke="#5d6578" stroke-width="1.5"/><rect x="44" y="351" width="112" height="98" rx="3" fill="#7fb8e6" stroke="#141824"/><text x="100" y="404" font-size="9.5" fill="#141824" text-anchor="middle" font-weight="700">20 kg · $100</text><rect x="44" y="201" width="112" height="148" rx="3" fill="#7fb8e6" stroke="#141824"/><text x="100" y="279" font-size="9.5" fill="#141824" text-anchor="middle" font-weight="700">30 kg · $120</text><text x="100" y="176" font-size="11" fill="#141824" text-anchor="middle" font-weight="700">Packed 50/50 kg · $220</text><text x="270" y="194" font-size="10" fill="#5d6578" text-anchor="middle">Shelf</text><rect x="220" y="210" width="100" height="48" rx="3" fill="#fff" stroke="#141824"/><text x="270" y="237" font-size="9.5" fill="#141824" text-anchor="middle">10 kg · $60</text><text x="270" y="249" font-size="8.5" fill="#5d6578" text-anchor="middle">$6/kg</text><text x="24" y="480" font-size="10" fill="#141824">Best whole-item bag so far: $220 (20 + 30 kg)</text><rect x="16" y="520" width="112" height="44" rx="6" fill="#eceff6" stroke="#9aa3b5"/><text x="72" y="546" font-size="11" fill="#141824" text-anchor="middle" font-weight="700">10 kg · $60</text><rect x="139" y="520" width="112" height="44" rx="6" fill="#7fb8e6" stroke="#9aa3b5"/><text x="195" y="546" font-size="11" fill="#141824" text-anchor="middle" font-weight="700">30 kg · $120</text><rect x="262" y="520" width="112" height="44" rx="6" fill="#7fb8e6" stroke="#9aa3b5"/><text x="318" y="546" font-size="11" fill="#141824" text-anchor="middle" font-weight="700">20 kg · $100</text><rect x="16" y="572" width="358" height="44" rx="6" fill="#eceff6" stroke="#9aa3b5"/><text x="195" y="598" font-size="11" fill="#141824" text-anchor="middle" font-weight="700">Items can be cut: off</text><text x="24" y="632" font-size="9" fill="#5d6578">(Earlier: 30 kg pressed with 20 kg empty → 'needs 30 kg, 20 kg empty')</text></g>
<g transform="translate(820,0)"><text x="0" y="16" font-size="13" fill="#141824" font-weight="700">3. Reveal (QA end: 20 out, cut on)</text><rect x="0" y="24" width="390" height="844" rx="20" fill="#f6f7fb" stroke="#141824"/><text x="16" y="56" font-size="11" fill="#5d6578">S3  top bar</text><text x="16" y="92" font-size="16" fill="#141824" font-weight="700">Best value per kilo first?</text><text x="16" y="112" font-size="11" fill="#5d6578">Milestone 2: cut mode seen</text><rect x="12" y="124" width="366" height="560" rx="8" fill="#eceff6" stroke="#d9dde8"/><text x="24" y="144" font-size="10" fill="#5d6578">Bag holds 50 kg. Tap an item to pack it.</text><rect x="40" y="200" width="120" height="250" rx="4" fill="#fff" stroke="#141824" stroke-width="2"/><text x="100" y="194" font-size="9" fill="#5d6578" text-anchor="middle">50 kg</text><line x1="36" y1="400" x2="40" y2="400" stroke="#5d6578" stroke-width="1.5"/><line x1="36" y1="350" x2="40" y2="350" stroke="#5d6578" stroke-width="1.5"/><line x1="36" y1="300" x2="40" y2="300" stroke="#5d6578" stroke-width="1.5"/><line x1="36" y1="250" x2="40" y2="250" stroke="#5d6578" stroke-width="1.5"/><rect x="44" y="401" width="112" height="48" rx="3" fill="#7fb8e6" stroke="#141824"/><text x="100" y="429" font-size="9.5" fill="#141824" text-anchor="middle" font-weight="700">10 kg · $60</text><rect x="44" y="301" width="112" height="98" rx="3" fill="#7fb8e6" stroke="#141824"/><text x="100" y="354" font-size="9.5" fill="#141824" text-anchor="middle" font-weight="700">20 kg · $100</text><rect x="44" y="201" width="112" height="98" rx="3" fill="#7fb8e6" stroke="#141824"/><text x="100" y="254" font-size="9.5" fill="#141824" text-anchor="middle" font-weight="700">20 of 30 kg · $80</text><line x1="44" y1="201" x2="156" y2="201" stroke="#141824" stroke-width="1.5" stroke-dasharray="4 3"/><text x="100" y="176" font-size="11" fill="#141824" text-anchor="middle" font-weight="700">Packed 50/50 kg · $240</text><text x="270" y="194" font-size="10" fill="#5d6578" text-anchor="middle">Shelf</text><text x="24" y="480" font-size="10" fill="#141824">Best whole-item bag so far: $220 (20 + 30 kg)</text><rect x="16" y="520" width="112" height="44" rx="6" fill="#7fb8e6" stroke="#9aa3b5"/><text x="72" y="546" font-size="11" fill="#141824" text-anchor="middle" font-weight="700">10 kg · $60</text><rect x="139" y="520" width="112" height="44" rx="6" fill="#7fb8e6" stroke="#9aa3b5"/><text x="195" y="546" font-size="11" fill="#141824" text-anchor="middle" font-weight="700">30 kg · $120</text><rect x="262" y="520" width="112" height="44" rx="6" fill="#7fb8e6" stroke="#9aa3b5"/><text x="318" y="546" font-size="11" fill="#141824" text-anchor="middle" font-weight="700">20 kg · $100</text><rect x="16" y="572" width="358" height="44" rx="6" fill="#7fb8e6" stroke="#9aa3b5"/><text x="195" y="598" font-size="11" fill="#141824" text-anchor="middle" font-weight="700">Items can be cut: on</text><rect x="12" y="690" width="366" height="160" rx="8" fill="#fff" stroke="#141824"/><text x="24" y="712" font-size="12" fill="#09704d" font-weight="700">Not quite / Your prediction held</text><text x="24" y="728" font-size="10.5" fill="#141824">Ratio first left 20 kg empty: $160. Your bag of</text><text x="24" y="744" font-size="10.5" fill="#141824">20 + 30 kg filled it: $220. When items could be cut,</text><text x="24" y="760" font-size="10.5" fill="#141824">ratio first poured in two thirds of the 30 kg item: $240.</text><text x="24" y="776" font-size="10.5" fill="#141824">Whole items leave gaps, so the best bag means trying</text><text x="24" y="792" font-size="10.5" fill="#141824">combinations; dynamic programming does it efficiently.</text></g>
</svg>
