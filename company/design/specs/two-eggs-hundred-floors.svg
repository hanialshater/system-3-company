<g transform="translate(0,0)"><text x="0" y="16" font-size="13"  fill="#141824" font-weight="700">1. Predict (locked; Plan B hidden)</text><rect x="0" y="24" width="390" height="844" rx="20" fill="#f6f7fb" stroke="#141824"  /><text x="16" y="56" font-size="11"  fill="#5d6578" >S3  top bar</text><text x="16" y="92" font-size="16"  fill="#141824" font-weight="700">Two eggs, a hundred floors</text><text x="16" y="112" font-size="11"  fill="#5d6578" >Halving finds anything fast. Does it with 2 eggs?</text><rect x="12" y="124" width="366" height="490" rx="8" fill="#eceff6" stroke="#d9dde8"  /><text x="24" y="146" font-size="10"  fill="#5d6578" >100 floors, 2 eggs; a broken egg is gone. You pick where egg 1 breaks.</text><text x="24" y="170" font-size="10"  fill="#5d6578" >Egg 1 breaks on drop:</text><rect x="24" y="178" width="64" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="56" y="204" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">1st</text><rect x="94" y="178" width="64" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="126" y="204" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">2nd</text><rect x="164" y="178" width="64" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="196" y="204" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">3rd</text><rect x="234" y="178" width="64" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="266" y="204" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">4th</text><rect x="304" y="178" width="64" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="336" y="204" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">Never</text><rect x="20" y="236" width="170" height="330" rx="6" fill="#fff" stroke="#d9dde8"  /><text x="28" y="252" font-size="10"  fill="#141824" font-weight="700">A: drop at 50, halve the rest</text><rect x="80" y="260" width="50" height="220" rx="2" fill="#eceff