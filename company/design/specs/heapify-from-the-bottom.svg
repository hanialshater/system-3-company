ize="14" text-anchor="middle" fill="#141824" font-weight="700">7</text><circle cx="245.5" cy="290" r="16" fill="#fff" stroke="#5d6578" stroke-width="1.5" /><text x="245.5" y="295" font-size="14" text-anchor="middle" fill="#141824" font-weight="700">4</text><circle cx="330.5" cy="290" r="16" fill="#fff" stroke="#5d6578" stroke-width="1.5" /><text x="330.5" y="295" font-size="14" text-anchor="middle" fill="#141824" font-weight="700">6</text><circle cx="224.25" cy="360" r="16" fill="#fff" stroke="#5d6578" stroke-width="1.5" /><text x="224.25" y="365" font-size="14" text-anchor="middle" fill="#141824" font-weight="700">1</text><circle cx="266.75" cy="360" r="16" fill="#fff" stroke="#5d6578" stroke-width="1.5" /><text x="266.75" y="365" font-size="14" text-anchor="middle" fill="#141824" font-weight="700">3</text><circle cx="309.25" cy="360" r="16" fill="#fff" stroke="#5d6578" stroke-width="1.5" /><text x="309.25" y="365" font-size="14" text-anchor="middle" fill="#141824" font-weight="700">2</text><circle cx="351.75" cy="360" r="16" fill="#fff" stroke="#5d6578" stroke-width="1.5" /><text x="351.75" y="365" font-size="14" text-anchor="middle" fill="#141824" font-weight="700">5</text><text x="211" y="420" font-size="11"  fill="#141824" font-weight="700">Swaps: 10</text><text x="211" y="440" font-size="9.5"  fill="#5d6578" >climbs: +0 +1 +1 +2 +2 +2 +2</text><rect x="203" y="478" width="175" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="290.5" y="504" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">Insert next</text><rect x="203" y="528" width="175" height="44" rx="8" fill="#eceff6" stroke="#9aa3b5"  /><text x="290.5" y="554" font-size="11" text-anchor="middle" fill="#9aa3b5" font-weight="700">Insert the rest</text><rect x="12" y="610" width="366" height="244" rx="8" fill="#fff" stroke="#d9dde8"  /><text x="24" y="632" font-size="13"  fill="#141824" font-weight="700">Your prediction missed: 4 swaps</text><text x="24" y="652" font-size="10.5"  fill="#141824" >Bottom up took 4 swaps: 3 and 2 sank one level</text><text x="24" y="667" font-size="10.5"  fill="#141824" >each, then 1 sank two from the top. The four</text><text x="24" y="682" font-size="10.5"  fill="#141824" >bottom spots have no children, so no sift started there.</text><text x="24" y="697" font-size="10.5"  fill="#141824" >One by one took 10: every new card was the biggest</text><text x="24" y="712" font-size="10.5"  fill="#141824" >so far and climbed as high as the tree allowed.</text><text x="24" y="727" font-size="10.5"  fill="#141824" >In any heap about half the spots are leaves and a</text><text x="24" y="742" font-size="10.5"  fill="#141824" >quarter sit one level up, so building from the bottom</text><text x="24" y="757" font-size="10.5"  fill="#141824" >stays under 2n swaps; inserting can cost n log n.</text></g>
</svg>
