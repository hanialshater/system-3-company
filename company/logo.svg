<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">System 3 Lessons: a card flipping from predict to reveal</title>
  <!-- the predict card, behind -->
  <g transform="rotate(-14 22 34)">
    <rect x="7" y="13" width="28" height="40" rx="5" fill="#7c5cff" stroke="#1f2328" stroke-width="2.4"/>
    <path d="M15.5 26 a5.5 5.5 0 1 1 8.5 4.6 c-2 1.3 -3 2.4 -3 4.6" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="21" cy="41" r="2.2" fill="#fff"/>
  </g>
  <!-- the reveal card, in front, mid-flip -->
  <g transform="rotate(12 42 32)">
    <rect x="28" y="11" width="28" height="40" rx="5" fill="#ffc83d" stroke="#1f2328" stroke-width="2.4"/>
    <path d="M42 19 V33" stroke="#1f2328" stroke-width="4.6" stroke-linecap="round"/>
    <circle cx="42" cy="40.5" r="2.7" fill="#1f2328"/>
    <path d="M31 46 l3 -3 M53 16 l-3 3" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".85"/>
  </g>
  <!-- the flip -->
  <path d="M13 59 Q32 66 51 57" fill="none" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M46.5 55 L52 56.6 L49.2 61.6" fill="none" stroke="#1f2328" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
