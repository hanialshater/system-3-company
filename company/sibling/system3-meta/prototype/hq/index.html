<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System 3 HQ</title>
<style>
:root { --bg:#f7f7f8; --panel:#ffffff; --side:#f0f0f2; --text:#1c1d21; --muted:#6b6f76; --line:#e3e4e8; --accent:#5e6ad2; --good:#2e9d66; --bad:#d64545; --warn:#c98a1b; --chip:#eceef4; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1012; --panel:#16171a; --side:#121316; --text:#e6e7ea; --muted:#8a8f98; --line:#26282d; --accent:#7c86ff; --good:#4cc38a; --bad:#ff6b6b; --warn:#e2a93b; --chip:#1f2126; } }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; background:var(--bg); color:var(--text); }
.app { display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
aside { background:var(--side); border-right:1px solid var(--line); padding:14px 10px; position:sticky; top:0; height:100vh; overflow:auto; }
.brand { font-weight:650; padding:4px 8px 14px; letter-spacing:.2px; }
.sec { font-size:11px; text-transform:uppercase; color:var(--muted); padding:12px 8px 4px; letter-spacing:.6px; }
.nav a { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px; color:var(--text); text-decoration:none; cursor:pointer; }
.nav a:hover { background:var(--chip); }
.nav a.on { background:var(--chip); font-weight:600; }
.nav .sub a { padding-left:22px; color:var(--muted); }
.nav .sub a.on { color:var(--text); }
.dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
.dot.s-running { background:var(--good); } .dot.s-onboarded { background:var(--accent); } .dot.s-ended { background:var(--muted); } .dot.s-empty { background:var(--line); }
main { padding:22px 28px; max-width:1200px; }
h1 { font-size:20px; margin:0 0 4px; } .sub1 { color:var(--muted); margin-bottom:18px; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
.card h3 { margin:0 0 6px; font-size:15px; } .k { color:var(--muted); font-size:12px; } .v { font-size:22px; font-weight:650; }
.row { display:flex; gap:12px; flex-wrap:wrap; }
.stat { flex:1; min-width:150px; }
table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }

tr:last-child td { border-bottom:none; }
.chip { display:inline-block; padding:1px 8px; border-radius:999px; background:var(--chip); font-size:12px; color:var(--muted); }
.up { color:var(--good); } .down { color:var(--bad); } .flat { color:var(--muted); }
.bar { height:8px; background:var(--chip); border-radius:4px; overflow:hidden; } .bar > i { display:block; height:100%; background:var(--accent); }
.thread { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:10px; }
.msg { padding:6px 0; border-bottom:1px dashed var(--line); } .msg:last-child { border-bottom:none; }
.who { font-weight:600; } .when { color:var(--muted); font-size:12px; margin-left:6px; }
svg.spark { width:100%; height:120px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
.empty { color:var(--muted); padding:30px; text-align:center; background:var(--panel); border:1px dashed var(--line); border-radius:10px; }
input.search { width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text); margin-bottom:12px; }
@media (max-width: 760px) { .app { grid-template-columns:1fr; } aside { position:static; height:auto; } main { padding:16px; } }
.replay { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:16px; }
.replay input[type=range] { flex:1; accent-color:var(--accent); } .replay button { border:1px solid var(--line); background:var(--chip); color:var(--text); border-radius:6px; padding:3px 10px; cursor:pointer; font:inherit; }
.replay .live { color:var(--good); font-weight:600; } .replay .past { color:var(--warn); font-weight:600; }
.floor { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.room { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; min-height:120px; }
.room h4 { margin:0 0 8px; font-size:13px; display:flex; justify-content:space-between; } .room.quiet { opacity:.75; border-style:dashed; }
.av { display:inline-flex; align-items:center; gap:6px; margin:0 6px 6px 0; padding:3px 8px 3px 3px; border-radius:999px; background:var(--chip); font-size:12px; }
.av b { width:22px; height:22px; border-radius:50%; display:inline-grid; place-items:center; color:#fff; font-size:10px; }
.av.idle { opacity:.55; } .av.crashed { outline:1px solid var(--bad); }
.tree li { margin:2px 0; }
.plan { overflow-x:auto; border-radius:14px; } .plan svg { width:100%; min-width:720px; display:block; }
.strip { width:100%; height:30px; display:block; background:var(--panel); border:1px solid var(--line); border-radius:8px; margin:-8px 0 12px; }
:root { --faceBg:#ffffff; --hqTile:#eef1f6; --hqTileLine:#e4e8f0; --hqWood:#f3e7d7; --hqWoodLine:#ead9c3; --hqCarpet:#efe8f8; --hqCarpetDot:#e1d6f1; --hqLobby:#fbf1d6; --hqFloor:#e8eefc; --hqDesk:#c9cfdb; --hqMonitor:#5b7cf0; --hqSofa:#b9a7e0; --hqHead:#ffffff; }
@media (prefers-color-scheme: dark) { :root { --faceBg:#d9dce3; --hqTile:#161a23; --hqTileLine:#1f2430; --hqWood:#2a2420; --hqWoodLine:#322a24; --hqCarpet:#251f33; --hqCarpetDot:#31294a; --hqLobby:#2c2717; --hqFloor:#172033; --hqDesk:#3a4254; --hqMonitor:#7c9cff; --hqSofa:#4b3f6b; --hqHead:#1e2433; } }
.building { stroke:var(--line); stroke-width:2; } .tileBg { fill:var(--hqTile); } .tileLine { fill:none; stroke:var(--hqTileLine); } .woodBg { fill:var(--hqWood); } .woodLine { fill:none; stroke:var(--hqWoodLine); }
.carpetBg { fill:var(--hqCarpet); } .lobbyBg { fill:var(--hqLobby); } .carpetDot { fill:var(--hqCarpetDot); } .heat { fill:#7c9cff; } .door { fill:var(--hqTile); }
.desk, .table { fill:var(--hqDesk); } .monitor { fill:var(--hqMonitor); opacity:.8; } .chair, .sofa { fill:var(--hqSofa); } .plant { fill:#2f8f5b; } .plantL { fill:#4fbf7f; }
.roomHead { fill:var(--hqHead); opacity:.92; } .roomName { font-size:11px; letter-spacing:.04em; text-transform:uppercase; font-weight:600; fill:var(--text); }
.roomRect { stroke:var(--line); } .roomRect.sel { stroke:var(--accent); stroke-width:3; } .roomRect.off { opacity:.6; stroke-dasharray:4 4; } .room { cursor:pointer; }
.rate { fill:var(--accent); opacity:.9; } .rateT { font-size:9.5px; font-weight:700; fill:#fff; } .pill { fill:var(--panel); stroke:var(--line); } .pillT { font-size:9px; font-weight:600; fill:var(--text); }
:root { --hallBg:#f4f5f8; --hallLine:#eceef3; --runner:#dfe4f2; --grassBg:#cfe8c4; --grassBlade:#9fcf8d; --gardenText:#3f6b35; --window:#9fd0ff; --bench:#b48a5a; --pot:#c8875a; }
@media (prefers-color-scheme: dark) { :root { --hallBg:#1b1f29; --hallLine:#20252f; --runner:#262c3b; --grassBg:#1d3322; --grassBlade:#2e5a35; --gardenText:#8fd18a; --window:#3b6ea8; --bench:#6b5136; --pot:#7a4f33; } }
.hallBg { fill:var(--hallBg); } .hallLine { stroke:var(--hallLine); stroke-width:1; } .hall { stroke:var(--line); } .runner { fill:var(--runner); } .hallText { font-size:10px; letter-spacing:.3em; fill:var(--muted); font-weight:600; }
.corridor { fill:var(--hallBg); } .grassBg { fill:var(--grassBg); } .grassBlade { stroke:var(--grassBlade); stroke-width:1.2; stroke-linecap:round; } .gardenRect { stroke:var(--grassBlade); } .gardenRect.sel { stroke:var(--accent); stroke-width:3; }
.path { fill:none; stroke:var(--hqWood); stroke-width:12; stroke-linecap:round; opacity:.9; } .bench { fill:var(--bench); } .pot { fill:var(--pot); } .shadow { fill:#000; opacity:.12; }
.flower0 { fill:#ff8fab; } .flower1 { fill:#ffd166; } .window { fill:var(--window); } .rug { fill:var(--hqSofa); opacity:.25; } .board { fill:var(--panel); stroke:var(--line); } .lamp { fill:#ffd166; } .lampGlow { fill:#ffd166; opacity:.18; }
.entranceGap { fill:var(--bg); } .glass { fill:var(--window); opacity:.8; } .mat { fill:var(--hqSofa); opacity:.7; } .matText { font-size:7px; letter-spacing:.2em; fill:#fff; font-weight:700; }
.ray { stroke:#ffd166; stroke-width:2.5; stroke-linecap:round; animation:burst 1.4s ease-out infinite; } @keyframes burst { 0% { opacity:0; stroke-dasharray:0 30; } 30% { opacity:1; } 100% { opacity:0; stroke-dasharray:8 30; stroke-dashoffset:-22; } }
.mini { flex:none; vertical-align:middle; } .av { gap:6px; padding:2px 10px 2px 2px; } .av .k { font-size:10px; }
.shelf { fill:var(--bench); } .book0 { fill:#5b7cf0; } .book1 { fill:#e07a5f; } .book2 { fill:#81b29a; } .mug { fill:#e9e2d0; stroke:#b59f7b; stroke-width:.8; } .stand { fill:var(--hqDesk); } .kbd { fill:var(--hqTileLine); }
.screen { fill:#2b3448; } .coffee { fill:#4a3428; } .cooler { fill:#dfe6f0; } .water { fill:#8ec5ff; } .tiny { font-size:7px; fill:var(--muted); letter-spacing:.05em; }
.headset { fill:none; stroke:#2b2f3a; stroke-width:2.2; } .cup { fill:#2b2f3a; } .mic { fill:none; stroke:#2b2f3a; stroke-width:1.4; }
.bubble rect, .bubble path { fill:var(--panel); stroke:var(--line); } .bubble path { stroke:none; } .bubble text { font-size:8.5px; fill:var(--text); } .bubble { filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.15)); }
.feed .fi { display:flex; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); } .feed .fi:last-child { border-bottom:none; } .feed ul { margin:4px 0 0 18px; padding:0; }
.ogrid { display:grid; grid-template-columns:1fr 340px; gap:14px; align-items:start; } @media (max-width:900px) { .ogrid { grid-template-columns:1fr; } }
.orow { display:flex; align-items:center; gap:8px; padding:4px 6px; border-radius:8px; flex-wrap:wrap; } .orow:hover, .orow.on { background:var(--chip); }
.who2 { display:inline-flex; align-items:center; gap:8px; cursor:pointer; } .tog { width:20px; border:none; background:none; color:var(--muted); cursor:pointer; font-size:13px; display:inline-block; text-align:center; }
.cnt { font-size:12px; color:var(--accent); cursor:pointer; } .crumbs { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:12px; padding:8px 10px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
.crumbs a { display:inline-flex; align-items:center; gap:5px; cursor:pointer; } .hits { margin:-4px 0 12px; } .opanel { position:sticky; top:12px; }
.tree ul { list-style:none; margin:0; padding-left:22px; border-left:1px solid var(--line); } .tree > ul { padding-left:0; border-left:none; }
.dh { margin:20px 0 8px; } .mission { margin-bottom:12px; font-size:15px; line-height:1.5; }
.bars { display:grid; gap:8px; } .brow { display:grid; grid-template-columns:minmax(160px,34%) 1fr 190px; gap:10px; align-items:center; } .blab { display:flex; align-items:center; gap:6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.btrack { position:relative; height:10px; background:var(--chip); border-radius:5px; } .btrack i { position:absolute; left:0; top:0; bottom:0; background:var(--s1); border-radius:0 4px 4px 0; } .btrack i.over { background:var(--crit); } .btrack b { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--text); opacity:.6; }
.bval { text-align:right; font-variant-numeric:tabular-nums; } .crit { color:var(--crit); font-weight:600; } .chip.live { background:var(--good); color:#fff; }
:root { --s1:#2a78d6; --crit:#d03b3b; --stgood:#0ca30c; --stwarn:#fab219; } @media (prefers-color-scheme: dark) { :root { --s1:#3987e5; } }
svg.chart { width:100%; height:150px; display:block; } .grid { stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; } .axis { font-size:10px; fill:var(--muted); } .sline { fill:none; stroke:var(--s1); stroke-width:2; }
.mcols { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; } .mcol { background:var(--side); border:1px solid var(--line); border-radius:10px; padding:8px; } .mhead { font-weight:600; margin:2px 4px 8px; }
.mcard { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px; } .st { display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%; font-size:11px; color:#fff; }
.st.good { background:var(--stgood); } .st.active { background:var(--s1); } .st.warn { background:var(--stwarn); color:#0b0b0b; } .st.next { background:var(--muted); } .st.crit { background:var(--crit); }
@media (max-width:700px) { .brow { grid-template-columns:1fr; gap:4px; } .bval { text-align:left; } }
main{min-width:0} .msg,.thread,td{overflow-wrap:anywhere}

<body>
<div class="app">
  <aside><div class="brand">System 3 HQ</div><nav class="nav" id="nav"></nav></aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<script>
// the starter's pages: few and generic; a page with nothing to show is hidden. Anything else is a company's own page
// (its HQ developers' extension point), not a starter page
const VIEWS = [["overview", "Overview"], ["dashboard", "Dashboard"], ["rooms", "Rooms"], ["org", "Org"], ["board", "Board"], ["notes", "Notes"], ["meetings", "Meetings"], ["knowledge", "Knowledge"]];
const HAS = { dashboard: () => state.dash || state.all.some((e) => e.type === "spend"), rooms: () => members(state.all).length, org: () => state.org.length || members(state.all).length, board: () => state.all.some((e) => e.type === "board.post" || e.type === "claim"), notes: () => state.all.some((e) => e.type === "note"), meetings: () => state.all.some((e) => e.type === "meeting"), knowledge: () => state.knowledge.length };
let state = { room: null, names: {}, open: null, focus: null, oq: "", city: [], company: null, view: "city", all: [], events: [], knowledge: [], org: [], q: "", at: null, playing: null };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (x) => (x == null ? "—" : `${(x * 100).toFixed(2)}%`);
const time = (t) => (t ? new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "");
const ago = (t) => { if (!t) return ""; const m = (Date.now() - Date.parse(t)) / 60000; return m < 1 ? "just now" : m < 60 ? `${Math.round(m)} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
async function api(p) { const r = await fetch(p); return r.json(); }
function go(company, view) { state.company = company; state.view = view; location.hash = company ? `${company}/${view}` : "city"; load(); }
window.addEventListener("hashchange", () => { const [c, v] = location.hash.slice(1).split("/"); if (c && c !== "city") { state.company = c; state.view = v || "overview"; } else { state.company = null; state.view = "city"; } load(); });
function nav() {
  let h = `<div class="sec">City</div><a class="${state.view === "city" ? "on" : ""}" onclick="go(null,'city')">All companies</a><div class="sec">Companies</div>`;
  for (const c of state.city) {
    h += `<a class="${state.company === c.id && state.view === "overview" ? "on" : ""}" onclick="go('${c.id}','overview')"><span class="dot s-${c.health.state}"></span>${esc(c.name)}</a>`;
    if (state.company === c.id) h += `<div class="sub">${[...VIEWS.filter(([v]) => !HAS[v] || HAS[v]() || state.view === v), ...(c.pages ?? []).map((p) => [`x-${p.id}`, esc(p.title)])].map(([v, n]) => `<a class="${state.view === v ? "on" : ""}" onclick="go('${c.id}','${v}')">${n}</a>`).join("")}</div>`;
  }
  $("#nav").innerHTML = h;
}
const HUES = [210, 340, 150, 30, 270, 190, 0, 90, 300, 50];
const hue = (id) => HUES[[...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % HUES.length];
const avatar = (id, cls = "", extra = "") => `<span class="av ${cls}" title="${esc(id)}${extra ? ` · ${esc(extra)}` : ""}">${mini(id, 22, cls)}${esc(nameOf(id))}<span class="k">${esc(id)}</span></span>`;
// replay: every company page draws from events up to state.at (null = live)
function setAt(v) { state.at = v == null ? null : Number(v); applyAt(); render(); }
function applyAt() { state.events = state.at == null ? state.all : state.all.filter((e) => Date.parse(e.t) <= state.at); }
function play() {
  if (state.playing) { clearInterval(state.playing); state.playing = null; return render(); }
  const t0 = Date.parse(state.all[0]?.t), t1 = Date.parse(state.all.at(-1)?.t); if (!(t1 > t0)) return;
  if (state.at == null || state.at >= t1) state.at = t0;
  state.playing = setInterval(() => { state.at = Math.min(t1, state.at + (t1 - t0) / 240); applyAt(); render(); if (state.at >= t1) { clearInterval(state.playing); state.playing = null; state.at = null; applyAt(); render(); } }, 100);
  render();
}
function replayBar() {
  if (state.all.length < 2) return "";
  const t0 = Date.parse(state.all[0].t), t1 = Date.parse(state.all.at(-1).t), at = state.at ?? t1;
  return `<div class="replay"><button onclick="play()">${state.playing ? "❚❚ pause" : "▶ replay"}</button><input type="range" min="${t0}" max="${t1}" step="${Math.max(1000, Math.round((t1 - t0) / 1000))}" value="${at}" oninput="if(state.playing){clearInterval(state.playing);state.playing=null}setAt(this.value)"><span class="${state.at == null ? "live" : "past"}">${state.at == null ? "live" : time(new Date(state.at).toISOString())}</span>${state.at != null ? `<button onclick="setAt(null)">live</button>` : ""}</div>`;
}
/** ended: the last crew.end has nothing after it (a run can be resumed after an end) */
const ended = (ev) => { const e = ev.findLast((x) => x.type === "crew.end"); return !!e && !ev.some((x) => x.t > e.t && x.type !== "crew.end"); };
function members(ev) {
  const start = ev.find((e) => e.type === "crew.start"), ids = new Set((start?.members ?? []).map((m) => m.id));
  for (const r of ev.find((e) => e.type === "company.start")?.roles ?? []) if (!["founder"].includes(r)) ids.add(r);
  for (const e of ev) if ((["land", "spend", "note", "board.post", "claim", "idle", "wake"].includes(e.type) || (e.type.startsWith("kernel.") && e.room)) && e.by && !["operator", "judge", "architect", "kernel", "code", "supervisor", "meta"].includes(e.by)) ids.add(e.by);
  return [...ids].map((id) => {
    const mine = ev.filter((e) => e.by === id), lands = mine.filter((e) => e.type === "land"), last = mine.at(-1), st = [...mine].reverse().find((e) => ["idle", "wake", "spend", "crash", "recover"].includes(e.type));
    const model = (start?.members ?? []).find((m) => m.id === id)?.model ?? "";
    return { id, model, lands: lands.length, gain: lands.reduce((a, l) => a + Math.max(0, l.after - l.before), 0), refused: mine.filter((e) => e.type === "land.refused").length, spent: mine.filter((e) => e.type === "spend").reduce((a, e) => a + (e.usd ?? 0), 0), notes: mine.filter((e) => e.type === "note").length, status: st?.type === "idle" ? "idle" : st?.type === "crash" ? "crashed" : ended(ev) ? "done" : "working", last: last?.t };
  });
}
function spark(ev) {
  const pts = [], start = ev.find((e) => e.type === "crew.start"); if (start) pts.push([Date.parse(start.t), start.rate ?? 0]);
  for (const l of ev.filter((e) => e.type === "land")) pts.push([Date.parse(l.t), l.after]);
  if (pts.length < 2) return `<div class="empty">No landings yet.</div>`;
  const x0 = pts[0][0], x1 = Math.max(pts.at(-1)[0], x0 + 1), ys = pts.map((p) => p[1]), y0 = Math.min(...ys), y1 = Math.max(...ys, y0 + 0.001), W = 1000, H = 120, P = 10;
  const X = (x) => P + ((x - x0) / (x1 - x0)) * (W - 2 * P), Y = (y) => H - P - ((y - y0) / (y1 - y0)) * (H - 2 * P);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>${pts.map((p) => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="var(--accent)"><title>${pct(p[1])} · ${time(p[0])}</title></circle>`).join("")}</svg><div class="k" style="margin-top:4px">score over time: ${pct(y0)} → ${pct(ys.at(-1))}</div>`;
}
function viewCity() {

  const row = (n, d) => { const k = kids[n.id] ?? [], open = state.open.has(n.id), m = stats[n.id]; return `<li><div class="orow ${state.focus === n.id ? "on" : ""}">${k.length ? `<button class="tog" onclick="toggleOrg('${n.id}')">${open ? "▾" : "▸"}</button>` : `<span class="tog"></span>`}<span class="who2" onclick="focusOrg('${n.id}')">${mini(n.id, 28, m?.status)}<b>${esc(nameOf(n.id))}</b><span class="k">${esc(n.title ?? n.id)}</span></span>${n.team ? `<span class="chip">${esc(n.team)}</span>` : ""}${m && (m.lands || m.spent) ? `<span class="k">${m.lands} lands · $${m.spent.toFixed(0)}</span>` : ""}${k.length && !open ? `<span class="cnt" onclick="toggleOrg('${n.id}')">${k.length} direct${k.length > 1 ? "s" : ""}${size(n.id) > k.length ? ` · ${size(n.id)} in all` : ""}</span>` : ""}</div>${k.length && open ? `<ul>${k.map((x) => row(x, d + 1)).join("")}</ul>` : ""}</li>`; };
  const q = state.oq.trim().toLowerCase(), hits = q ? nodes.filter((n) => `${n.id} ${nameOf(n.id)} ${n.title ?? ""} ${n.team ?? ""}`.toLowerCase().includes(q)).slice(0, 8) : [];
  const f = state.focus && by[state.focus], fm = f && stats[f.id];
  const panel = f ? `<div class="card opanel"><div class="row" style="align-items:center;gap:10px">${mini(f.id, 48, fm?.status)}<div><h3 style="margin:0">${esc(nameOf(f.id))}</h3><div class="k">${esc(f.title ?? "")} · ${esc(f.id)}${f.team ? ` · ${esc(f.team)}` : ""}</div></div></div>
    ${up(f) ? `<div class="k" style="margin-top:10px">reports to</div><div>${avatarBtn(up(f))}</div>` : ""}${(kids[f.id] ?? []).length ? `<div class="k" style="margin-top:8px">directs (${kids[f.id].length})</div><div>${kids[f.id].map((x) => avatarBtn(x.id)).join("")}</div>` : ""}
    ${fm ? `<div class="k" style="margin-top:8px">work</div><div>${fm.status} · ${fm.lands} lands · +${(fm.gain * 100).toFixed(1)} pts · $${fm.spent.toFixed(2)}${fm.refused ? ` · ${fm.refused} refused` : ""}</div>` : ""}
    <div class="feed" style="margin-top:8px">${state.events.filter((e) => e.by === f.id && ["land", "land.refused", "note", "board.post", "claim", "meeting"].includes(e.type)).slice(-5).reverse().map(feedItem).join("")}</div></div>` : "";
  return `<h1>Org</h1><div class="sub1">${nodes.length} roles${teams.size ? ` in ${teams.size} teams` : ""} · open a team with ▸ · pick anyone for their line to the top</div>${replayBar()}
  <input class="search" placeholder="find someone by name, role or team" value="${esc(state.oq)}" oninput="state.oq=this.value;render()">${hits.length ? `<div class="hits">${hits.map((n) => avatarBtn(n.id)).join("")}</div>` : ""}
  ${f ? `<div class="crumbs">${chain(f.id).map((n) => `<a onclick="focusOrg('${n.id}')">${mini(n.id, 18)}${esc(nameOf(n.id))}</a>`).join(`<span class="k">›</span>`)}</div>` : ""}
  <div class="ogrid"><div class="tree"><ul>${roots.map((n) => row(n, 0)).join("")}</ul></div>${panel}</div>${orgChanges()}`;
}
// org changes go through the company's org tool (proposed, then approved by the founder); the HQ shows them from the log
function orgChanges() {
  const ev = state.events.filter((e) => ["kernel.org-propose", "kernel.org-change", "kernel.onboard", "kernel.offboard", "org.propose", "org.change"].includes(e.type));
  if (!ev.length) return "";
  const done = new Set(ev.filter((e) => !e.type.endsWith("propose")).map((e) => e.change));
  return `<h3 style="margin:22px 0 8px">Org changes</h3><div class="k" style="margin-bottom:8px">proposed through the org tool; applied only with the founder's approval</div><table><tr><th>when</th><th>change</th><th>role</th><th>by</th><th>state</th></tr>${ev.filter((e) => e.type.endsWith("propose")).reverse().map((e) => `<tr><td class="k">${time(e.t)}</td><td>${esc(e.op ?? "")} <span class="k">${esc(e.change ?? "")}</span><div class="k">${esc(e.reason ?? "")}</div></td><td>${avatarBtn(e.role)}</td><td>${esc(nameOf(e.by))}</td><td><span class="chip">${done.has(e.change) ? "applied" : "awaiting the founder"}</span></td></tr>`).join("")}</table>`;
}
const avatarBtn = (id) => `<a class="av" style="cursor:pointer" onclick="focusOrg('${id}')">${mini(id, 22)}${esc(nameOf(id))}</a>`;
function toggleOrg(id) { state.open.has(id) ? state.open.delete(id) : state.open.add(id); render(); }
// focusing someone opens the line above them, so they are visible in the tree
function focusOrg(id) { state.focus = id; state.oq = ""; const by = Object.fromEntries(state.org.map((n) => [n.id, n])); let n = by[id]; for (let k = 0; n && k < 30; k++) { if (by[n.reportsTo] && n.reportsTo !== n.id) state.open.add(n.reportsTo); n = by[n.reportsTo]; } render(); }
function viewBoard() {
  const posts = state.events.filter((e) => e.type === "board.post" && e.by !== "judge").reverse(), cl = state.events.filter((e) => e.type === "claim").slice(-15).reverse();
  return `<h1>Board</h1><div class="sub1">findings, dead ends and hypotheses, each with its evidence and what would show it wrong</div>
  ${posts.length ? `<table><tr><th>kind</th><th>area</th><th>by</th><th>finding</th></tr>${posts.map((e) => `<tr><td><span class="chip">${esc(e.kind)}</span></td><td>${esc(e.area)}</td><td class="who">${esc(e.by)}</td><td>${esc(e.text)}<div class="k">evidence: ${esc(e.evidence)} · wrong if: ${esc(e.wrongIf)}</div></td></tr>`).join("")}</table>` : `<div class="empty">No posts yet.</div>`}
  <h3 style="margin:20px 0 8px">Claims</h3>${cl.length ? `<table><tr><th>when</th><th>who</th><th>area</th><th>what</th></tr>${cl.map((e) => `<tr><td class="k">${time(e.t)}</td><td class="who">${esc(e.by)}</td><td>${esc(e.area)}</td><td>${esc(e.text)}</td></tr>`).join("")}</table>` : `<div class="empty">No claims.</div>`}`;
}
function viewMeetings() {
  const ms = state.events.filter((e) => e.type === "meeting").reverse();
  if (!ms.length) return `<h1>Meetings</h1><div class="empty">No meetings recorded. Members record one with <code>crew minutes</code>.</div>`;
  return `<h1>Meetings</h1><div class="sub1">minutes recorded by the members who met: who was there, what was decided, the objections raised (${ms.length})</div>${ms.map((m) => `<div class="thread"><div class="msg"><span class="who">${esc(m.title)}</span><span class="when">${time(m.t)}</span><div class="k">chair ${esc(m.by)} · with ${esc((m.attendees ?? []).filter((a) => a !== m.by).join(", ") || "nobody else")}</div>${(m.decisions ?? []).length ? `<div class="k" style="margin-top:8px">decided</div><ul>${m.decisions.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>` : ""}${(m.objections ?? []).length ? `<div class="k">objections</div><ul>${m.objections.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>` : ""}${(m.decisions ?? []).length ? `<details style="margin-top:6px"><summary class="k">full minutes</summary><div style="white-space:pre-wrap;margin-top:6px">${esc(m.text)}</div></details>` : `<div style="white-space:pre-wrap;margin-top:6px">${esc(m.text)}</div>`}</div></div>`).join("")}`;
}
function viewNotes() {
  const seen = new Set(), msgs = state.events.filter((e) => e.type === "note").filter((e) => { const k = `${e.t}${e.by}${e.text}`; if (e.broadcast && seen.has(k)) return false; seen.add(k); return true; });
  if (!msgs.length) return `<h1>Notes</h1><div class="empty">No notes yet.</div>`;
  const byDay = {}; for (const m of msgs) (byDay[m.t.slice(0, 13)] ??= []).push(m);
  return `<h1>Notes</h1><div class="sub1">the members' conversations, as a record (${msgs.length} messages)</div>${replayBar()}${Object.entries(byDay).reverse().map(([hr, ms]) => `<div class="thread"><div class="k">${time(hr + ":00:00Z")}</div>${ms.map((m) => `<div class="msg"><span class="who">${esc(m.by)}</span> → ${m.broadcast ? "all" : esc(m.to)}<span class="when">${time(m.t)}</span><div>${esc(m.text)}</div></div>`).join("")}</div>`).join("")}`;
}
function viewKnowledge() {
  const q = state.q.toLowerCase(), ks = state.knowledge.filter((e) => !q || JSON.stringify(e).toLowerCase().includes(q)).sort((a, b) => (b.belief ?? 0) - (a.belief ?? 0));
  return `<h1>Knowledge</h1><div class="sub1">what members recorded when they left: practices, findings, dead ends, pitfalls, with evidence and belief</div><input class="search" placeholder="search the knowledge base" value="${esc(state.q)}" oninput="state.q=this.value;render()">${ks.length ? `<table><tr><th>belief</th><th>kind</th><th>topic</th><th>entry</th></tr>${ks.slice(0, 200).map((e) => `<tr><td>${e.belief ?? ""}</td><td><span class="chip">${esc(e.kind)}</span></td><td>${esc(e.topic)}</td><td>${esc(e.text)}<div class="k">evidence: ${esc(e.evidence)} · ${esc(e.run ?? "")} ${esc(e.by ?? "")}</div></td></tr>`).join("")}</table>` : `<div class="empty">No entries.</div>`}`;
}
function render() {
  nav(); const c = state.city.find((x) => x.id === state.company);
  const v = !c ? viewCity() : state.view.startsWith("x-") ? state.custom : { overview: () => viewOverview(c), dashboard: () => viewDashboard(c), rooms: viewRooms, org: () => viewOrg(c), board: viewBoard, notes: viewNotes, meetings: viewMeetings, knowledge: viewKnowledge }[state.view]?.() ?? viewOverview(c);
  const focus = document.activeElement?.classList?.contains("search"); $("#main").innerHTML = v; if (focus) { const s = $("input.search"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}
async function load() {
  state.city = await api("/api/city");
  if (state.company) { if (state.loaded !== state.company) { state.at = null; state.loaded = state.company; state.open = null; state.focus = null; state.room = null; state.pos = {}; state.drawn = false; } [state.all, state.knowledge, state.org, state.dash] = await Promise.all([api(`/api/company/${state.company}/events`), api(`/api/company/${state.company}/knowledge`), api(`/api/company/${state.company}/org`), api(`/api/company/${state.company}/dashboard`)]); nameAll(); applyAt(); }
  // a company's own page (the extension point): its module renders from the same events and knowledge
  if (state.company && state.view.startsWith("x-")) {
    try { const mod = await import(`/api/company/${state.company}/page/${state.view.slice(2)}.js?t=${Date.now()}`); state.custom = mod.render({ events: state.events, knowledge: state.knowledge, company: state.city.find((x) => x.id === state.company), esc, time, pct }); }
    catch (e) { state.custom = `<h1>Page error</h1><div class="empty">${esc(e.message)}</div>`; }
  }
  render();
}
(() => { const [c, v] = location.hash.slice(1).split("/"); if (c && c !== "city") { state.company = c; state.view = v || "overview"; } load(); setInterval(() => { if (!document.activeElement?.classList?.contains("search") && !state.playing) load(); }, 15000); })();
</script>
